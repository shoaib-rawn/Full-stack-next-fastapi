name: LedgerLite CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - "render.yaml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerlite
          POSTGRES_PASSWORD: ledgerlite_test_password
          POSTGRES_DB: ledgerlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlite -d ledgerlite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ledgerlite:ledgerlite_test_password@localhost:5432/ledgerlite
      JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_LEARNING_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
